<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秒薪 Paytick</title>
  <meta name="description" content="秒薪 Paytick：实时看到今天挣了多少钱 / Watch your pay tick up in real time">
  <link rel="icon" href="icon.png">
  <style>
    :root {
      --bg: #f3f4f1;
      --surface: #ffffff;
      --text: #1f2328;
      --text-2: #57606a;
      --border: #e3e5e0;
      --accent: #b8860b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --surface: #202124;
        --text: #e8e8e6;
        --text-2: #a6a8ab;
        --border: #34363a;
        --accent: #f4c430;
      }
    }

    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.7 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-align: center;
    }

    img {
      width: 96px;
      height: 96px;
    }

    h1 {
      margin: 12px 0 4px;
      font-size: 30px;
    }

    p {
      margin: 6px 0;
      color: var(--text-2);
    }

    nav {
      margin-top: 24px;
      font-size: 15px;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>秒薪 Paytick</h1>
    <p>实时看到今天挣了多少钱，每一秒都在涨。</p>
    <p lang="en">Watch your pay tick up, second by second.</p>
    <nav>
      <a href="privacy/?lang=zh">隐私政策</a> · <a href="privacy/?lang=en" lang="en">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
